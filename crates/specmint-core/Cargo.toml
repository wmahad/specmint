[package]
name = "specmint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OpenAPI → TypeScript generation core (Kubb-compatible)"
license = "MIT"
publish = false

[lib]
name = "specmint"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
heck = "0.5"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
openapiv3 = "2.2"
petgraph = "0.7"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
